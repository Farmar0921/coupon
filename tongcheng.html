        }

        .highlight {

        .btn {

            padding: 18px;
            border-radius: 50px;

        .btn-indigo {

        }

        /* 返回按钮配色（和大件快销客返回按钮风格统一） */
        .btn-back {
            background: linear-gradient(90deg, #7B68EE, #9370DB);
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .bottom-tips {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
            line-height: 1.5;
