<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顺丰大件快销客 - Money Love Me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff4081;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .title {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .desc {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin: 15px 0;
            font-weight: 500;
        }

        .highlight {
            color: #ff4081;
            font-weight: bold;
            font-size: 20px;
        }

        .qr-box {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 15px;
            overflow: hidden;
        }

        .qr-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            color: white;
        }

        .btn-purple {
            background: linear-gradient(90deg, #7B68EE, #9370DB);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .bottom-tips {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
            line-height: 1.5;
        }
    </style>
</head>

<body>
<div class="main-box">
    <div class="logo">顺丰大件快销客</div>
    <div class="title">Money Love Me · 大件优惠</div>

    <div class="highlight">以下是您优惠券码</div>
    <div class="desc">微信扫码即可领取</div>

    <!-- 二维码区域 - 已替换为实际图片 -->
    <div class="qr-box">
        <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/a9ef2bbafc7b4c4e8096e09b1b70af48.png~tplv-a9rns2rl98-24:720:720.png?lk3s=8e244e95&rcl=20260418233242A7CA015B7EC5DF9C3458&rrcfp=8a172a1a&x-expires=1777131163&x-signature=6lc9NH2uBxqsNeiTuACGlB2dhEQ%3D" 
             class="qr-img" 
             alt="顺丰大件快销客优惠券领取二维码">
    </div>

    <button class="btn btn-purple" onclick="window.history.back()">
        ← 返回上一页
    </button>

    <div class="bottom-tips">
        优惠券实时到账 | 官方活动真实有效
    </div>
</div>
</body>
</html>
